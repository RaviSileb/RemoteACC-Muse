[workspace]
members = [
  "crates/racc-core",
  "crates/racc-tty",
  "crates/racc-av",
  "crates/racc-bootstrapd",
  "crates/racc-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.77"

[profile.release]
lto = true
strip = true
