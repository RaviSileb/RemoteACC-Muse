[package]
name = "racc-av"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RemoteACC audio/video subsystem: tile diffing, codec cascade, FPS control, capture backends"

[lib]
name = "racc_av"
path = "src/lib.rs"

[features]
default = []
# OS capture backendy (fáze 3; zatím výběr potvrzuje API, zachytávání dodá OS vrstva)
win-dxgi = []
linux-pipewire = []
macos-sck = []

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
