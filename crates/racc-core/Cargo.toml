[package]
name = "racc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RemoteACC core: QUIC transport, crypto (Ed25519/X25519/ChaCha20-Poly1305), Protobuf protocol, config, C-ABI"

[lib]
name = "racc_core"
path = "src/lib.rs"
# rlib pro workspace + cdylib (.dll/.so/.dylib) pro Flutter/Tauri FFI.
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
prost = "0.13"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
zstd = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
