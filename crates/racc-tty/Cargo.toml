[package]
name = "racc-tty"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RemoteACC TTY subsystem: PTY sessions (ConPTY/openpty/NDK pty) multiplexed over QUIC"

[lib]
name = "racc_tty"
path = "src/lib.rs"

[dependencies]
racc-core = { path = "../racc-core" }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
thiserror = "1"
tracing = "0.1"
